# Swoop Ahead on Cloudflare Pages: the website in public/, the service in functions/.
#
#   wrangler pages dev                      run it on this computer
#   wrangler pages deploy                   publish it
#
# database_id is the live database (made with `wrangler d1 create swoopahead`). It is an id, not a secret.
# The admin passphrase is a secret, never in this file:
#   wrangler pages secret put ADMIN_PASSPHRASE --project-name swoopahead
name = "swoopahead"
pages_build_output_dir = "public"
compatibility_date = "2025-11-01"

[[d1_databases]]
binding = "DB"
database_name = "swoopahead"
database_id = "244a3fe4-17b6-4bf3-a94b-739ff814f6c5"
